<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}SessionLab{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0a0c0f;
  --bg2:     #0f1318;
  --bg3:     #141920;
  --border:  #1e2730;
  --border2: #253040;
  --text:    #c8d4e0;
  --text2:   #7a8fa0;
  --text3:   #4a5f70;
  --accent:  #00d4ff;
  --green:   #00e676;
  --red:     #ff4444;
  --yellow:  #ffcc00;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  line-height: 1.6;
}
body::before {
  content:'';
  position:fixed; inset:0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);
  pointer-events:none; z-index:9999;
}
nav {
  border-bottom:1px solid var(--border);
  padding:0 2rem; height:52px;
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg2); position:sticky; top:0; z-index:100;
}
.nav-logo {
  font-family:var(--mono); font-size:13px; font-weight:700;
  color:var(--accent); letter-spacing:0.05em; text-decoration:none;
}
.nav-logo span { color:var(--text3); }
.nav-links { display:flex; gap:1.5rem; align-items:center; }
.nav-links a {
  font-family:var(--mono); font-size:11px; color:var(--text2);
  text-decoration:none; letter-spacing:0.08em; text-transform:uppercase;
  transition:color 0.2s;
}
.nav-links a:hover { color:var(--accent); }
.status-dot {
  width:6px; height:6px; background:var(--green); border-radius:50%;
  display:inline-block; margin-right:6px;
  animation:pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
main { padding:3rem 2rem; max-width:1100px; margin:0 auto; }
.tag {
  font-family:var(--mono); font-size:10px; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--text3); margin-bottom:0.5rem;
}
.card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:4px; padding:1.5rem;
}
.btn {
  font-family:var(--mono); font-size:12px; font-weight:500;
  letter-spacing:0.08em; text-transform:uppercase;
  padding:0.6rem 1.4rem; border:1px solid var(--accent);
  background:transparent; color:var(--accent); cursor:pointer;
  transition:all 0.2s; text-decoration:none; display:inline-block;
  border-radius:2px;
}
.btn:hover { background:var(--accent); color:var(--bg); }
.btn-muted { border-color:var(--border2); color:var(--text2); }
.btn-muted:hover { background:var(--border2); color:var(--text); }
.btn-danger { border-color:var(--red); color:var(--red); }
.btn-danger:hover { background:var(--red); color:var(--bg); }
.btn-full { width:100%; text-align:center; }
input {
  width:100%; background:var(--bg3); border:1px solid var(--border2);
  color:var(--text); font-family:var(--mono); font-size:13px;
  padding:0.65rem 0.9rem; border-radius:2px; outline:none;
  transition:border-color 0.2s;
}
input:focus { border-color:var(--accent); }
input::placeholder { color:var(--text3); }
label {
  font-family:var(--mono); font-size:10px; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--text3);
  display:block; margin-bottom:0.4rem;
}
.form-group { margin-bottom:1.2rem; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="nav-logo" href="/">[<span>//</span>] SessionLab</a>
  <div class="nav-links">
    <span><span class="status-dot"></span>online</span>
    {% block nav_extra %}{% endblock %}
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
