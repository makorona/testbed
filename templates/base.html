<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PULSE{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d12; --surface:#15151d; --surface2:#1c1c27; --line:#272734;
  --text:#e9e9f0; --muted:#8a8a9c; --dim:#55556a;
  --brand:#ff3d77; --brand2:#8b5cff;
  --ok:#22c55e; --warn:#f5b301; --bad:#ff4d4d;
  --grad:linear-gradient(120deg,var(--brand),var(--brand2));
  --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:0;min-height:100vh}
@media(max-width:720px){.wrap{grid-template-columns:1fr}}

/* sidebar */
.side{border-right:1px solid var(--line);padding:1.5rem 1rem;position:sticky;top:0;height:100vh}
@media(max-width:720px){.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
.logo{font-family:var(--disp);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;display:flex;align-items:center;gap:.1rem;margin-bottom:.2rem}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pulse-line{height:3px;width:42px;background:var(--grad);border-radius:2px;margin-bottom:1.8rem;position:relative;overflow:hidden}
.pulse-line::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.6);width:12px;animation:slide 2.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-14px)}100%{transform:translateX(46px)}}
.nav{display:flex;flex-direction:column;gap:.2rem}
.nav a{display:flex;align-items:center;gap:.75rem;padding:.7rem .85rem;border-radius:10px;color:var(--muted);font-weight:500;font-size:.95rem;transition:.15s}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.active{background:var(--surface2);color:var(--text)}
.nav .ico{width:20px;text-align:center;font-size:1.05rem}
.nav .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:10px}
.side-foot{position:absolute;bottom:1.2rem;left:1rem;right:1rem}
@media(max-width:720px){.side-foot{position:static;margin-top:1rem}}
.logout{display:block;text-align:center;padding:.6rem;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:.85rem;font-weight:500;transition:.15s}
.logout:hover{border-color:var(--bad);color:var(--bad)}

/* main column */
.main{padding:0}
.topbar{padding:1.1rem 1.5rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,13,18,.85);backdrop-filter:blur(10px);z-index:5;font-family:var(--disp);font-weight:500;font-size:1.05rem}
.col{padding:1.5rem}

.btn{font-family:var(--body);font-weight:600;font-size:.9rem;padding:.6rem 1.3rem;border:none;border-radius:10px;background:var(--grad);color:#fff;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:var(--surface);filter:none}
input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:var(--body);font-size:.95rem;padding:.7rem .9rem;border-radius:10px;outline:none;transition:.15s}
input:focus,textarea:focus{border-color:var(--brand2)}
input::placeholder,textarea::placeholder{color:var(--dim)}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;font-weight:500}
.field{margin-bottom:1rem}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
