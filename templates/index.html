{% extends "base.html" %}
{% block title %}PULSE — социальная сеть{% endblock %}
{% block head %}
<style>
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;overflow:hidden}
.glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,255,.18),transparent 60%);top:-150px;filter:blur(20px)}
.glow2{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,119,.15),transparent 60%);bottom:-150px;right:-100px;filter:blur(20px)}
.hero-logo{font-family:var(--disp);font-weight:700;font-size:4rem;letter-spacing:-.03em;margin-bottom:.5rem;position:relative}
.hero-logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.beat{height:5px;width:90px;background:var(--grad);border-radius:3px;margin:0 auto 2rem;position:relative;overflow:hidden}
.beat::after{content:'';position:absolute;inset:0;width:20px;background:rgba(255,255,255,.7);animation:slide2 2.2s ease-in-out infinite}
@keyframes slide2{0%{transform:translateX(-22px)}100%{transform:translateX(98px)}}
.tag{font-size:1.3rem;color:var(--muted);max-width:440px;margin-bottom:2.5rem;position:relative}
.tag b{color:var(--text);font-weight:600}
.cta{display:flex;gap:1rem;position:relative}
.cta .btn{padding:.85rem 2rem;font-size:1rem}
.foot-note{position:absolute;bottom:1.5rem;font-size:.75rem;color:var(--dim);font-family:var(--disp)}
</style>
{% endblock %}
{% block body %}
<div class="hero">
  <div class="glow"></div><div class="glow2"></div>
  <div class="hero-logo">PULSE<b>.</b></div>
  <div class="beat"></div>
  <div class="tag">Делись моментами. Общайся с близкими. <b>Будь на связи.</b></div>
  <div class="cta">
    <a href="/register" class="btn">Создать аккаунт</a>
    <a href="/login" class="btn btn-ghost">Войти</a>
  </div>
  <div class="foot-note">учебная среда — дипломный проект по информационной безопасности</div>
</div>
{% endblock %}
