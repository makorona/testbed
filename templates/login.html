{% extends "base.html" %}
{% block title %}Вход — PULSE{% endblock %}
{% block head %}
<style>
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{width:100%;max-width:380px}
.box .logo{font-family:var(--disp);font-weight:700;font-size:1.8rem;text-align:center}
.box .logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.beat{height:4px;width:60px;background:var(--grad);border-radius:3px;margin:.3rem auto 1.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.8rem}
.h{font-family:var(--disp);font-weight:500;font-size:1.15rem;margin-bottom:1.3rem}
.err{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3);color:var(--bad);font-size:.85rem;padding:.7rem .9rem;border-radius:10px;margin-bottom:1.1rem}
.alt{text-align:center;margin-top:1.2rem;font-size:.88rem;color:var(--muted)}
.alt a{color:var(--brand);font-weight:600}
</style>
{% endblock %}
{% block body %}
<div class="auth"><div class="box">
  <div class="logo">PULSE<b>.</b></div><div class="beat"></div>
  <div class="card">
    <div class="h">С возвращением</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <div class="field"><label>Имя пользователя</label>
        <input name="username" placeholder="username" autocomplete="off" required></div>
      <div class="field"><label>Пароль</label>
        <input type="password" name="password" placeholder="••••••••" required></div>
      <button class="btn" style="width:100%">Войти</button>
    </form>
  </div>
  <div class="alt">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
</div></div>
{% endblock %}
